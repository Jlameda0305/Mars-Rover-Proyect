<text x="686" y="128" fill="#2980B9" font-size="13" font-weight="bold">CARGA 1 : ESC TRACCIÓN IZQUIERDA (3 Motores DC en Paralelo)</text>
<text x="686" y="158" fill="#E74C3C" font-size="12">&#8226; Alimentación Potencia: +7.4V Directo de Batería (Hasta 20A pico)</text>
<text x="686" y="182" fill="#111111" font-size="12">&#8226; Retorno de Corriente: GND Común hacia el Bus Central</text>
<rect x="670" y="240" width="540" height="100" rx="8" fill="#FFFFFF" stroke="#D35400" stroke-width="2" filter="url(#shadow2)"/>
<text x="686" y="268" fill="#D35400" font-size="13" font-weight="bold">CARGA 2 : ESC TRACCIÓN DERECHA (3 Motores DC en Paralelo)</text>
<text x="686" y="298" fill="#E74C3C" font-size="12">&#8226; Alimentación Potencia: +7.4V Directo de Batería (Hasta 20A pico)</text>
<text x="686" y="322" fill="#111111" font-size="12">&#8226; Retorno de Corriente: GND Común hacia el Bus Central</text>
<line x1="440" y1="154" x2="670" y2="154" stroke="#E74C3C" stroke-width="3"/>
<circle cx="440" cy="154" r="4.5" fill="#E74C3C"/>
<line x1="440" y1="294" x2="670" y2="294" stroke="#E74C3C" stroke-width="3"/>
<circle cx="440" cy="294" r="4.5" fill="#E74C3C"/>
<line x1="1210" y1="178" x2="1450" y2="178" stroke="#111111" stroke-width="3"/>
<circle cx="1450" cy="178" r="4.5" fill="#111111"/>
<line x1="1210" y1="318" x2="1450" y2="318" stroke="#111111" stroke-width="3"/>
<circle cx="1450" cy="318" r="4.5" fill="#111111"/>
<rect x="670" y="440" width="540" height="145" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="2" filter="url(#shadow2)"/>
<text x="686" y="468" fill="#27AE60" font-size="13" font-weight="bold">CARGA 3 : 4x SERVOMOTORES DE DIRECCIÓN (MG996R)</text>
<text x="686" y="498" fill="#F39C12" font-size="12">&#8226; Alimentación V+: 5.0V Regulada desde UBEC (Consumo ~2.5A pico)</text>
<text x="686" y="525" fill="#111111" font-size="12">&#8226; Retorno V-: Conexión rígida a GND Común</text>
<text x="686" y="555" fill="#7F8C8D" font-size="11">Protección: El UBEC filtra los picos inductivos de los servos aislando la lógica</text>
<line x1="550" y1="494" x2="670" y2="494" stroke="#F39C12" stroke-width="3"/>
<circle cx="550" cy="494" r="4.5" fill="#F39C12"/>
<line x1="1210" y1="521" x2="1450" y2="521" stroke="#111111" stroke-width="3"/>
<circle cx="1450" cy="521" r="4.5" fill="#111111"/>
<rect x="670" y="635" width="540" height="145" rx="8" fill="#FFFFFF" stroke="#8E44AD" stroke-width="2" filter="url(#shadow2)"/>
<text x="686" y="663" fill="#8E44AD" font-size="13" font-weight="bold">CARGA 4 : ESP32 DEVKIT-C V4 (LÓGICA Y COMUNICACIONES)</text>
<text x="686" y="693" fill="#F39C12" font-size="12">&#8226; Entrada de Alimentación: Pin "5V / VIN" (Consumo ~180 - 260 mA)</text>
<text x="686" y="720" fill="#111111" font-size="12">&#8226; Referencia: Pin "GND" unido rígidamente al Bus de Masa Común</text>
<text x="686" y="750" fill="#7F8C8D" font-size="11">Filtro interno: El LDO onboard del ESP32 baja los 5V a 3.3V limpios para el SoC</text>
<line x1="550" y1="689" x2="670" y2="689" stroke="#F39C12" stroke-width="3"/>
<circle cx="550" cy="689" r="4.5" fill="#F39C12"/>
<line x1="1210" y1="716" x2="1450" y2="716" stroke="#111111" stroke-width="3"/>
<circle cx="1450" cy="716" r="4.5" fill="#111111"/>
<rect x="85" y="660" width="410" height="240" rx="6" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1.5" filter="url(#shadow2)"/>
<rect x="85" y="660" width="410" height="28" rx="4" fill="#34495E"/>
<text x="99" y="679" fill="#FFFFFF" font-size="12" font-weight="bold">REGLAS CRÍTICAS DE ENERGÍA Y CABLEADO</text>
<text x="97" y="710" fill="#C0392B" font-size="10.5" font-weight="bold">1. Doble Riel: <tspan fill="#2C3E50" font-weight="normal">La batería alimenta directo a los ESCs (7.4V) y el</tspan></text>
<text x="97" y="732" fill="#C0392B" font-size="10.5" font-weight="bold"> <tspan fill="#2C3E50" font-weight="normal">UBEC alimenta exclusivamente a servos y ESP32 (5.0V).</tspan></text>
<text x="97" y="754" fill="#C0392B" font-size="10.5" font-weight="bold">2. Calibre de Cables: <tspan fill="#2C3E50" font-weight="normal">Usa cable grueso (14-16 AWG) para batería y ESCs.</tspan></text>
<text x="97" y="776" fill="#C0392B" font-size="10.5" font-weight="bold"> <tspan fill="#2C3E50" font-weight="normal">Usa cable standard (22-24 AWG) para servos y ESP32.</tspan></text>
<text x="97" y="798" fill="#C0392B" font-size="10.5" font-weight="bold">3. Masa Única (Estrella): <tspan fill="#2C3E50" font-weight="normal">Une todos los cables negativos en un punto</tspan></text>
<text x="97" y="820" fill="#C0392B" font-size="10.5" font-weight="bold"> <tspan fill="#2C3E50" font-weight="normal">central para evitar lazos de tierra (ground loops).</tspan></text>
<text x="97" y="842" fill="#C0392B" font-size="10.5" font-weight="bold">4. Jamás alimentar servos <tspan fill="#2C3E50" font-weight="normal">desde el pin 3.3V ni 5V del ESP32;</tspan></text>
<text x="97" y="864" fill="#C0392B" font-size="10.5" font-weight="bold"> <tspan fill="#2C3E50" font-weight="normal">provocaría reinicios continuos (brownouts).</tspan></text>
</svg>