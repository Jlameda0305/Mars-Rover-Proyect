<text x="1087" y="935" fill="#C0392B" font-size="13" font-weight="bold">Title: <tspan fill="#2C3E50" font-weight="normal">Mars Rover - Esquema de Alimentación y Distribución</tspan></text>
<text x="1087" y="961" fill="#C0392B" font-size="12" font-weight="bold">Date: <tspan fill="#34495E" font-weight="normal">15/10/2026</tspan></text>
