<text x="101" y="825" fill="#C0392B" font-size="11" font-weight="bold">&#8226; Conexión en Paralelo:<tspan fill="#2C3E50" font-weight="normal"> Los 3 motores de cada lado comparten la misma salida del ESC (M+ y M-).</tspan></text>
<text x="101" y="855" fill="#C0392B" font-size="11" font-weight="bold">&#8226; Regla de Inversión de Giro:<tspan fill="#2C3E50" font-weight="normal"> Si alguna rueda gira al revés, invierte sus 2 cables únicamente en ese motor.</tspan></text>
<text x="101" y="885" fill="#C0392B" font-size="11" font-weight="bold">&#8226; Corriente de Tracción:<tspan fill="#2C3E50" font-weight="normal"> Cada ESC soporta ~15-20A pico. El cableado a motores debe ser mín. 18-20 AWG.</tspan></text>
<text x="101" y="915" fill="#C0392B" font-size="11" font-weight="bold">&#8226; Giro 360° (Modo Spin):<tspan fill="#2C3E50" font-weight="normal"> Los ESCs giran en sentidos opuestos mientras los 4 servos forman una circunferencia.</tspan></text>
