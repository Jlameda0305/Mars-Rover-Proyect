name: "Mars Rover RC Simulation & Telemetry Test"
version: 1
author: "Mars Rover Development Team"
steps:
  - delay: 1000ms
  - wait-serial: "Mars Rover Firmware (Wokwi Sim)"
  - wait-serial: "[SELF-TEST RESULT] Assertions:"
  - wait-serial: "Rover Ready (Simplified RC)!"
  
  # Test 0: Trigger On-Demand Self-Test
  - delay: 300ms
  - write-serial: "T\n"
  - wait-serial: "[CMD_ACK] RUNNING SELF-TEST..."
  - wait-serial: "[SELF-TEST RESULT]"
  - delay: 300ms

  # Test 1: Forward Drive
  - delay: 300ms
  - write-serial: "F\n"
  - wait-serial: "[CMD_ACK] FORWARD: Throttle 1800 us, Steer 1500 us"
  - delay: 500ms
  
  # Test 2: Backward Drive
  - write-serial: "B\n"
  - wait-serial: "[CMD_ACK] BACKWARD: Throttle 1200 us, Steer 1500 us"
  - delay: 500ms

  # Test 3: Turn Left (Differential Skid Turn)
  - write-serial: "L\n"
  - wait-serial: "[CMD_ACK] TURN LEFT: Throttle 1600 us, Steer 1200 us"
  - delay: 500ms

  # Test 4: Turn Right (Differential Skid Turn)
  - write-serial: "R\n"
  - wait-serial: "[CMD_ACK] TURN RIGHT: Throttle 1600 us, Steer 1800 us"
  - delay: 500ms

  # Test 5: Spin 360 Mode (In-place Axial Pivot)
  - write-serial: "P\n"
  - wait-serial: "[CMD_ACK] SPIN 360: Mode SPIN, Steer 1800 us"
  - delay: 500ms

  # Test 6: Stop / Neutral Fail-safe
  - write-serial: "S\n"
  - wait-serial: "[CMD_ACK] STOP / NEUTRAL: Throttle 1500 us, Steer 1500 us"
  - delay: 500ms

  # Test 7: Fine Custom Command (Steer=1350us, Throttle=1750us, Mode=NORMAL)
  - write-serial: "CMD:1350,1750,0\n"
  - wait-serial: "[CMD_ACK] CUSTOM: Steer=1350 us, Throttle=1750 us, Mode=NORMAL"
  - delay: 1000ms

  # Verify periodic telemetry
  - wait-serial: "[TELEMETRY]"
